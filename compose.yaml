# Local one-command run of the backend container.
#
#   docker compose up --build
#   → API at http://localhost:8000  ·  docs at http://localhost:8000/docs
#
# Reads OPENAI_API_KEY (and any provider/model overrides) from the repo-root .env,
# the same file the app uses when run directly. Named volumes persist the vector
# index and HITL checkpoints across runs so the reference corpora are embedded
# once, not on every boot.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: pv-rag-assistant-backend:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma:/app/backend/chroma_db
      - checkpoints:/app/backend/checkpoints
    restart: unless-stopped

volumes:
  chroma:
  checkpoints:
