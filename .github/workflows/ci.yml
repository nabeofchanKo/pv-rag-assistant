# CI — every push and pull request.
#
# Three independent jobs, run in parallel. None of them calls an LLM or spends
# money: the backend tests run on fakes, and the E2E suite runs against a fake
# backend that replays recorded responses. The real-model evaluation
# (experiments/) deliberately stays out of CI — it costs money and is not
# deterministic, so it is a measurement, not a gate.
#
# The job names below are what branch protection on `main` requires.

name: CI

# Work branches are tested through their pull request, not on push: with both,
# every push to a branch with an open PR ran the whole suite twice on the same
# commit. `main` still runs on push (the post-merge state), and a branch with
# no PR open yet can be run by hand from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # same as backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      # Settings require a key at import time; no test calls the API with it.
      - run: python -m pytest backend/tests -q
        env:
          OPENAI_API_KEY: sk-ci-dummy-never-used

  web:
    name: web (lint, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24" # same as web/Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `next build` also type-checks everything tsconfig includes (e2e too).
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

  docker:
    name: docker (build images)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built, never pushed. Without BAKE_INDEXES the backend build needs no
      # secret — this checks the Dockerfiles, not the deploy.
      - name: backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: web image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
